{% extends "base.html" %}

{% block title %}New Club{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="page-header">
            <h1>Create Club</h1>
            <p>Super Admin only.</p>
        </div>


        <div class="card">

            <div class="card-body p-4 p-md-5">

                <div
                    style="
                        display: inline-block;
                        background: var(--blue);
                        color: white;
                        border: 2px solid var(--black);
                        padding: 6px 9px;
                        font-size: 9px;
                        font-weight: 700;
                        letter-spacing: .5px;
                        margin-bottom: 22px;
                    "
                >
                    CLUB MANAGEMENT
                </div>


                <form method="POST">

                    <div class="mb-4">

                        <label class="form-label">
                            Club name
                        </label>

                        <input
                            class="form-control"
                            name="name"
                            placeholder="e.g. Robotics Club"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            name="description"
                            rows="4"
                            placeholder="Short description"
                        ></textarea>

                    </div>


                    <div
                        style="
                            border-top: 2px solid var(--black);
                            padding-top: 18px;
                            margin-top: 8px;
                        "
                    >

                        <button
                            class="btn btn-primary"
                            type="submit"
                        >
                            Create Club
                        </button>

                        <a
                            class="btn btn-outline-primary"
                            href="{{ url_for('admin_dashboard') }}"
                            style="margin-left: 5px;"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>


        <div
            class="mt-4"
            style="
                border-left: 4px solid var(--orange);
                padding-left: 12px;
                color: var(--muted);
                font-size: 9px;
                line-height: 1.7;
            "
        >
            New clubs can be created by the Super Admin and used for future campus events.
        </div>

    </div>

</div>

{% endblock %}
