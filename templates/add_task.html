{% extends "base.html" %}

{% block title %}Add Task{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">

        <div class="page-header">
            <h1>Add a task</h1>
            <p>Add an academic task manually. Tasks from Teams will appear automatically when connected.</p>
        </div>

        <div class="card">

            <div class="card-body p-4 p-md-5">

                <form method="POST">

                    <div class="mb-4">
                        <label class="form-label">Task</label>

                        <input
                            class="form-control"
                            name="ts"
                            placeholder="e.g. PR Assignment 2"
                            required
                        >
                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Subject
                            </label>

                            <input
                                class="form-control"
                                name="subject"
                                placeholder="e.g. Product Realization"
                            >

                        </div>


                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Due date
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                name="dt"
                                required
                            >

                        </div>

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            name="ds"
                            rows="4"
                            placeholder="Optional details"
                        ></textarea>

                    </div>


                    <div class="d-flex justify-content-end pt-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Add Task
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}
